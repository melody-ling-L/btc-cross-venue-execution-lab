name: Reproducible research
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-and-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-research.txt
      - run: python -m pip install -r requirements-research.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m crossvenue demo --output outputs/ci-demo
      - uses: actions/upload-artifact@v7
        with:
          name: synthetic-research-report
          path: outputs/ci-demo
