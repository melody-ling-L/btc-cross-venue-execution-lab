[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-venue-risk-lab"
version = "0.1.0"
description = "Causal BTC cross-venue execution research, independent ledgers, and reproducible stress experiments"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
research = ["matplotlib>=3.9,<4"]

[project.scripts]
crossvenue = "crossvenue.cli:main"

[tool.setuptools.packages.find]
include = ["crossvenue*"]
